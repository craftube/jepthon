services:
  - type: web
    name: joker-userbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m JoKeRUB
    envVars:
      - key: PORT
        value: 8000
      - key: ENV
        value: "True"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
